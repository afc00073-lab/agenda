[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenda-academica-inteligente"
version = "1.0.0"
description = "Agenda académica de escritorio con interfaz HTML5/CSS3, gadget flotante y notificaciones nativas"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6,<7.0",
    "icalendar>=5.0",
]

[project.optional-dependencies]
pruebas = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/ventanas/*", "src/puente/*"]
