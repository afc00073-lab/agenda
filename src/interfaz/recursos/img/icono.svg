<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Agenda Académica Inteligente">
    <defs>
        <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7c6cff"/>
            <stop offset="0.55" stop-color="#4aa8ff"/>
            <stop offset="1" stop-color="#34e2c4"/>
        </linearGradient>
        <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#050915" flood-opacity="0.35"/>
        </filter>
    </defs>

    <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#fondo)" filter="url(#sombra)"/>
    <rect x="4" y="4" width="120" height="60" rx="30" fill="url(#brillo)"/>

    <!-- Cuerpo del calendario -->
    <rect x="27" y="35" width="74" height="65" rx="13" fill="#0a1020" opacity="0.28"/>
    <rect x="27" y="35" width="74" height="65" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>

    <!-- Anillas -->
    <rect x="42" y="26" width="6" height="20" rx="3" fill="#ffffff"/>
    <rect x="80" y="26" width="6" height="20" rx="3" fill="#ffffff"/>

    <!-- Separador de cabecera -->
    <path d="M28 53h72" stroke="#ffffff" stroke-opacity="0.62" stroke-width="2.4"/>

    <!-- Marca de verificación -->
    <path d="M46 72l10 10 25-25" fill="none" stroke="#ffffff" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pequeño destello -->
    <circle cx="96" cy="31" r="5" fill="#ffffff" opacity="0.9"/>
</svg>
